<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- Opened as ".../op" (no slash, as the app's hint shows)? The files below are relative to the op/ folder,
     so go to ".../op/" first. Apache does this by itself; PHP's built-in server and others don't. -->
<script>if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) location.replace(location.pathname + '/' + location.search);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จอเรียกคิว op</title>
<style>
  /* Big and high-contrast: read on a TV across the room */
  body { margin: 0; padding: 24px 32px; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column;
         background: #0f1b3d; color: #fff; font: 28px sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0 0 16px; }
  #online { width: 24px; height: 24px; border-radius: 50%; background: #c0392b; }
  #online.on { background: #3fa34d; }
  /* 3 parts: the call being made (left, stays until the next call), waiting (top right), already called (bottom right).
     Portrait screens stack them. */
  main { flex: 1; min-height: 0; display: grid; gap: 24px; grid-template-columns: 3fr 2fr; grid-template-rows: 1fr 1fr; }
  #big { grid-row: span 2; display: flex; flex-direction: column; justify-content: center;
         padding: 24px; border-radius: 24px; background: #1c2a5c; text-align: center; }
  .list { overflow: hidden; padding: 16px 24px; border-radius: 24px; background: #16224a; }
  .list h2 { margin: 0 0 12px; font-size: 32px; color: #9fb0ff; }
  .list ul { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .list li { padding: 6px 16px; border-radius: 12px; background: #1c2a5c; font-size: 36px; font-weight: bold; }
  #called li { color: #9fb0ff; }
  @media (orientation: portrait) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr; } #big { grid-row: auto; } }
  #big .q { font-size: 140px; font-weight: bold; line-height: 1.1; }
  #big .fname { font-size: 56px; }
  #big .counter { font-size: 40px; color: #9fb0ff; }
  #status { color: #ff8a80; }
  /* A new call (display.js adds .flash): number, name, counter rise into place one after another, then the box
     fades out and back in 5 times, 1 s each. The padding keeps Thai marks above/below the line out of the clip. */
  .mask { overflow: hidden; padding: .3em 0; margin: -.3em 0; }
  #big.flash .mask > * { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
  #big.flash #fname { animation-delay: .12s; }
  #big.flash #counter { animation-delay: .24s; }
  #big.flash { animation: flash 1s ease-in-out .9s 5; }
  @keyframes rise { from { transform: translateY(130%); } }
  @keyframes flash { 50% { opacity: 0.15; } }
  @media (prefers-reduced-motion: reduce) { #big.flash .mask > * { animation: none; } }
</style>
</head>
<!-- data-dep = this department's code on q_signal -->
<body data-dep="op">
<header><h1 id="title">จอเรียกคิว</h1><div id="online" title="q_signal"></div></header>
<main>
  <section id="big"><div>เชิญหมายเลข</div>
    <div class="mask"><div class="q" id="q">-</div></div>
    <div class="mask"><div class="fname" id="fname"></div></div>
    <div class="mask"><div class="counter" id="counter"></div></div>
  </section>
  <section class="list"><h2>รอเรียก</h2><ul id="waiting"></ul></section>
  <section class="list"><h2>เรียกแล้ว</h2><ul id="called"></ul></section>
</main>
<div id="status"></div>

<!-- Local copy (jQuery 3.7.1, SRI sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=): TV boxes may have no internet -->
<script src="../jquery.min.js"></script>
<script src="../socket.io.min.js"></script>
<script src="display.js"></script>
</body>
</html>
